<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — RollaDev</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Ambient background particles -->
<div class="particles" aria-hidden="true">
  <span class="particle"></span><span class="particle"></span><span class="particle"></span>
  <span class="particle"></span><span class="particle"></span><span class="particle"></span>
  <span class="particle"></span><span class="particle"></span><span class="particle"></span>
  <span class="particle"></span><span class="particle"></span><span class="particle"></span>
</div>

<main class="error-page">
  <p class="eyebrow">// 404</p>
  <h1>This page doesn't exist</h1>
  <p class="error-sub">
    The link might be broken, or the page may have moved. Let's get you back to somewhere real.
  </p>
  <a href="index.html" class="btn btn-primary">Back Home</a>
  <p class="error-path mono" id="errorPath" aria-hidden="true"></p>
</main>

<script>
  // Shows the broken path in a small terminal-style line, a nice honest touch,
  // purely cosmetic, no tracking or logic beyond reading the current URL.
  document.getElementById('errorPath').textContent = '$ ' + window.location.pathname + ' → not found';
</script>
</body>
</html>
